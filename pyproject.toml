[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contract-vault"
version = "0.1.4"
description = "Post-signature management layer of the contract-ops CLI suite: register, search and surface deadlines for SIGNED contracts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "DrBaher", email = "Drbaher@gmail.com" }]
keywords = [
  "contracts",
  "cli",
  "legal",
  "obligations",
  "renewals",
  "ics",
  "calendar",
  "git",
  "contract-ops",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Legal Industry",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
  "Topic :: Utilities",
  "Typing :: Typed",
]
# Zero runtime dependencies. Fully functional with no extras.
dependencies = []

[project.optional-dependencies]
# Extraction itself is delegated to extract-cli; these extras pull it in with the
# right document backends. contract-vault works WITHOUT them (piped JSON / .json input).
docx = ["extract-cli[docx]"]
pdf = ["extract-cli[pdf]"]
llm = ["extract-cli[llm]"]
dev = [
  "pytest>=7.0",
  "coverage>=7.0",
  "mypy>=1.5",
  "build>=1.0",
]

[project.scripts]
contract-vault = "contract_vault_cli:main"

[project.urls]
Homepage = "https://cli.drbaher.com"
Repository = "https://github.com/DrBaher/contract-vault-cli"
Suite = "https://github.com/DrBaher"
Changelog = "https://github.com/DrBaher/contract-vault-cli/blob/main/CHANGELOG.md"

# Single-module project: ship contract_vault_cli.py explicitly (the module name does
# not match the normalized distribution name, so hatchling cannot auto-detect it).
[tool.hatch.build.targets.wheel]
include = ["contract_vault_cli.py"]

[tool.hatch.build.targets.sdist]
include = [
  "contract_vault_cli.py",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "ARCHITECTURE.md",
  "CONTRIBUTING.md",
  "Makefile",
  "pyproject.toml",
  "docs/**",
  "config/**",
  "tests/**",
  "scripts/**",
]

[tool.mypy]
# No python_version pin: mypy targets the running interpreter, so the CI matrix
# (3.9-3.12) type-checks every supported version. requires-python stays >=3.9.
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.run]
source = ["contract_vault_cli"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
