name: Publish

# Publishes to PyPI via Trusted Publishing (OIDC) when a v* tag is pushed.
# Requires a one-time PyPI "trusted publisher" setup for this repo + environment.
# The manual (workflow_dispatch) trigger verifies that setup without cutting a new
# version: skip-existing means an already-published version is skipped, not re-uploaded.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Verify the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(python -c 'import contract_vault_cli as c; print(c.__version__)')"
          test "$TAG" = "$PKG" || { echo "tag $TAG != version $PKG"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/contract-vault
    permissions:
      id-token: write   # mandatory for Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          skip-existing: true
          attestations: true   # PEP 740 build provenance for the published artifacts
