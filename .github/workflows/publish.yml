name: Publish

# Publishes to PyPI via Trusted Publishing (OIDC) when a v* tag is pushed.
# Requires a one-time PyPI "trusted publisher" setup for this repo + environment.
# The manual (workflow_dispatch) trigger verifies that setup without cutting a new
# version: skip-existing means an already-published version is skipped, not re-uploaded.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Verify the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(python -c 'import contract_vault_cli as c; print(c.__version__)')"
          test "$TAG" = "$PKG" || { echo "tag $TAG != version $PKG"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/contract-vault
    permissions:
      id-token: write   # mandatory for Trusted Publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          skip-existing: true
          attestations: true   # PEP 740 build provenance for the published artifacts
